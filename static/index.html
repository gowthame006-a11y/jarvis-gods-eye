<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis + God’s Eye</title><style>body{margin:0;background:#0c1020;color:#eaf0ff;font:16px system-ui}main{max-width:1100px;margin:auto;padding:32px}h1{font-size:36px}h2{color:#b8c7ff}.panel{background:#161e34;border:1px solid #303e60;padding:24px;border-radius:18px;margin:20px 0}input,select,textarea,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #4a5879;margin:5px;background:#0d1426;color:white}textarea{width:90%;min-height:100px}button{background:#6554d9;cursor:pointer}button:hover{background:#8675ee}.row{padding:14px;border-bottom:1px solid #34405b}.muted{color:#a5b3ce}#notice{white-space:pre-wrap;color:#ffd789}pre{white-space:pre-wrap}svg{width:100%;height:260px;background:#10182b}label{display:inline-block}</style><main><h1>Jarvis + God’s Eye</h1><p class="muted">Gowtham E. · Local full-stack project</p><div id="notice" role="alert"></div><section id="login" class="panel"><h2>Sign in</h2><p>Use employee or manager and the first-run password printed in the terminal.</p><input id="username" aria-label="Username" value="employee"><input id="password" type="password" aria-label="Password" placeholder="Password"><button onclick="login()">Sign in</button></section><section id="app" class="panel" hidden><button onclick="logout()">Sign out</button><h2>Offline assistant</h2><input id="message" aria-label="Command" placeholder="add task Prepare demo"><button onclick="run(async()=>{let j=await api('chat',{message:$('message').value});$('reply').textContent=j.reply;await load()})">Send</button><pre id="reply"></pre><h2>Tasks</h2><input id="title" aria-label="Task" placeholder="New task"><button onclick="action('task',{title:$('title').value})">Add</button><div id="tasks"></div><h2>God’s Eye • simulation</h2><p class="muted">Schematic Chennai coordinate plot. Synthetic vehicles; not a street map or GPS feed.</p><button onclick="action('simulate',{})">Advance simulation</button><svg id="map" viewBox="0 0 700 260" role="img" aria-label="Simulated vehicle positions"></svg><div id="vehicles"></div><h2>Activity log</h2><div id="events"></div></section></main><script>let token=sessionStorage.getItem('token');const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error);return j}async function run(fn){try{$('notice').textContent='';await fn()}catch(e){$('notice').textContent=e.message}}async function login(){await run(async()=>{let j=await api('login',{username:$('username').value,password:$('password').value});token=j.token;sessionStorage.setItem('token',token);await load()})}async function logout(){await run(async()=>{await api('logout',{});sessionStorage.removeItem('token');token=null;$('login').hidden=false;$('app').hidden=true})}async function load(){let d=await api('dashboard');$('login').hidden=true;$('app').hidden=false;render(d)}async function action(path,data){await run(async()=>{await api(path,data);await load()})}
function render(d){$('tasks').innerHTML=d.tasks.map(t=>`<div class="row"><button onclick="action('toggle',{id:${t.id}})">${t.done?'Completed':'Mark done'}</button> ${esc(t.title)}</div>`).join('')||'No tasks yet.';$('vehicles').innerHTML=d.vehicles.map(v=>`<div class="row">${esc(v.id)} · ${v.speed} km/h · ${v.lat.toFixed(5)}, ${v.lon.toFixed(5)}</div>`).join('');$('map').innerHTML=d.vehicles.map(v=>{let x=Math.max(25,Math.min(650,(v.lon-80.1)*3000)),y=Math.max(25,Math.min(230,230-(v.lat-13.05)*2000));return `<circle cx="${x}" cy="${y}" r="10" fill="#a897ff"/><text x="${x+15}" y="${y}" fill="white">${esc(v.id)}</text>`}).join('');$('events').innerHTML=d.events.map(e=>`<div class="row">${esc(e.created)} · ${esc(e.message)}</div>`).join('')||'No events yet.'}
if(token)run(load);</script></html>
